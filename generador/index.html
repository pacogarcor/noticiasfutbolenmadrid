<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personalizador de Tarjetas</title></head><body style="margin:0;background:#000">
<!-- 1. CARGA DE LIBRERÍAS (Tailwind, FontAwesome, React, ReactDOM, Babel) -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- 2. CONTENEDOR DE LA APP -->
<div id="card-generator-root"></div>

<!-- 3. CÓDIGO DE LA APLICACIÓN -->
<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  // COMPONENTE AUXILIAR: BOTÓN DE COLOR CIRCULAR
  const ColorSwatch = ({ label, value, onChange }) => (
    <div className="flex flex-col items-center gap-2">
      <div className="relative group cursor-pointer">
        <div 
          className="w-10 h-10 rounded-full border-2 border-gray-200 shadow-md transition-transform transform group-hover:scale-110 group-active:scale-95" 
          style={{ backgroundColor: value }}
        ></div>
        <input 
          type="color" 
          value={value} 
          onChange={(e) => onChange(e.target.value)} 
          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
        />
      </div>
      <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider text-center leading-tight">
        {label}
      </span>
    </div>
  );

  const App = () => {
    const canvasRef = useRef(null);
    
    // ESTADOS DE IMÁGENES
    const [userImage, setUserImage] = useState(null); 
    const [logo1, setLogo1] = useState(null);       
    const [logo2, setLogo2] = useState(null);       
    
    const fixedBackgroundSrc = "./11 ideal 3ª Extremadura .jpg"; 
    
    const [bgImageObject, setBgImageObject] = useState(null);
    const [selectedSize, setSelectedSize] = useState('A4');
    const [activeTab, setActiveTab] = useState('photo'); 

    // Textos por defecto
    const [texts, setTexts] = useState({
      title: "Titulo 1",
      title2: "Titulo 2",
      title3: "Titulo 3",
      message: "Escribe aquí los textos principales...\nPuedes usar dos columnas para organizar mejor la información.",
      footer: "Texto para el pie de página",
      number: "10"
    });

    // Colores por defecto
    const [colors, setColors] = useState({
      badge: "#808080",     
      badgeText: "#000000", 
      message: "#000000", 
      footer: "#000000",
      secondary: "#000000" 
    });

    const [visibility, setVisibility] = useState({
      image: true,
      logo1: true,
      logo2: true,
      title: true,
      title2: true,
      title3: true,
      message: true,
      number: true,
      footer: true
    });

    const [textStyles, setTextStyles] = useState({
      title:   { font: 'sans-serif', bold: true, italic: false, bullets: false, columns: 1 },
      title2:  { font: 'sans-serif', bold: true, italic: false, bullets: false, columns: 1 },
      title3:  { font: 'sans-serif', bold: false, italic: false, bullets: false, columns: 1 },
      message: { font: 'sans-serif', bold: false, italic: true, bullets: false, columns: 1 }, 
      footer:  { font: 'sans-serif', bold: false, italic: false, bullets: false, columns: 1 },
      number:  { font: 'sans-serif', bold: true, italic: false, bullets: false, columns: 1 }
    });

    const [transforms, setTransforms] = useState({
      image:   { x: 0, y: 0, scale: 1.0 },
      logo1:   { x: 0, y: 0, scale: 1.0 },
      logo2:   { x: 0, y: 0, scale: 1.0 },
      title:   { x: 0, y: 0, scale: 1.0 },
      title2:  { x: 0, y: 0, scale: 1.0 },
      title3:  { x: 0, y: 0, scale: 1.0 },
      message: { x: 0, y: 0, scale: 1.0 },
      number:  { x: 0, y: 0, scale: 1.0 },
      footer:  { x: 0, y: 0, scale: 1.0 }
    });
    
    const [activeElement, setActiveElement] = useState('image');

    const paperSizes = {
      A5: { width: 1754, height: 1240, label: "A5 (Pequeño)" },
      A4: { width: 2480, height: 1754, label: "A4 (Estándar)" },
      A3: { width: 3508, height: 2480, label: "A3 (Grande)" },
      A2: { width: 4961, height: 3508, label: "A2 (Póster)" }
    };

    const fontOptions = [
      { value: 'sans-serif', label: 'Moderna (Sans)' },
      { value: 'serif', label: 'Clásica (Serif)' },
      { value: 'monospace', label: 'Máquina (Mono)' },
      { value: 'cursive', label: 'Manuscrita' },
      { value: 'fantasy', label: 'Decorativa' }
    ];

    const elementLabels = {
      image: 'Foto',
      logo1: 'Escudo',
      logo2: 'Bandera',
      title: 'Título 1',
      title2: 'Título 2',
      title3: 'Título 3',
      message: 'Texto',
      number: 'Número',
      footer: 'Pie'
    };

    useEffect(() => {
      const img = new Image();
      img.src = fixedBackgroundSrc;
      img.crossOrigin = "Anonymous"; 
      img.onload = () => {
        setBgImageObject(img);
      };
      img.onerror = () => {
        console.warn(`Error cargando imagen de fondo fijo: ${fixedBackgroundSrc}`);
      };
    }, []);

    // FUNCIÓN CORREGIDA: Ahora es genérica y se llama handleImageUpload
    const handleImageUpload = (e, setter) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => setter(img);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    const handleMessageKeyDown = (e) => {
      if (e.key === 'Enter') {
        if (textStyles.message.bullets) {
          e.preventDefault(); 
          setTexts(prev => ({
            ...prev,
            message: prev.message + '\n• '
          }));
        }
      }
    };

    const handleMessageChange = (e) => {
      let val = e.target.value;
      setTexts(prev => ({ ...prev, message: val }));
    };

    const handleTextChange = (key, val) => {
      setTexts(prev => ({ ...prev, [key]: val }));
    };

    const handleMainTextColorChange = (val) => {
        setColors(prev => ({
            ...prev,
            message: val,
            footer: val
        }));
    };

    const updateTransform = (key, value) => {
      setTransforms(prev => ({
        ...prev,
        [activeElement]: {
          ...prev[activeElement],
          [key]: parseFloat(value)
        }
      }));
    };

    const updateTextStyle = (key, value) => {
      if (!textStyles[activeElement]) return;
      setTextStyles(prev => ({
        ...prev,
        [activeElement]: {
          ...prev[activeElement],
          [key]: value
        }
      }));
    };

    const toggleVisibility = (element) => {
      setVisibility(prev => ({
        ...prev,
        [element]: !prev[element]
      }));
    };

    const getFontString = (element, sizePx) => {
      const style = textStyles[element];
      const weight = style.bold ? 'bold' : 'normal';
      const variant = style.italic ? 'italic' : 'normal';
      return `${variant} ${weight} ${sizePx}px ${style.font}`;
    };

    const drawImageContain = (ctx, img, x, y, w, h) => {
      if (!img.width || !img.height) return;
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let drawW, drawH, drawX, drawY;

      if (imgRatio > targetRatio) {
        drawW = w;
        drawH = w / imgRatio;
        drawX = x;
        drawY = y + (h - drawH) / 2;
      } else {
        drawH = h;
        drawW = h * imgRatio;
        drawX = x + (w - drawW) / 2;
        drawY = y;
      }
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
    };

    const drawImageCover = (ctx, img, x, y, w, h) => {
      if (!img.width || !img.height) return;
      const sourceRatio = img.width / img.height;
      const targetRatio = w / h;
      let sx, sy, sWidth, sHeight;

      if (sourceRatio > targetRatio) {
        sHeight = img.height;
        sWidth = img.height * targetRatio;
        sx = (img.width - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = img.width;
        sHeight = img.width / targetRatio;
        sx = (img.width - sWidth) / 2;
        sy = (img.height - sHeight) / 2;
      }
      ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, w, h);
    };

    const roundRect = (ctx, x, y, w, h, r) => {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      return ctx;
    };

    const renderContent = (ctx, width, height) => {
      const hexToRgb = (hex) => {
          const bigint = parseInt(hex.slice(1), 16);
          return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
      };

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#f3f4f6";
      ctx.fillRect(0, 0, width, height);

      if (bgImageObject && bgImageObject.complete && bgImageObject.naturalWidth !== 0) {
        drawImageCover(ctx, bgImageObject, 0, 0, width, height);
      } else {
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#9ca3af";
        ctx.font = `${width * 0.03}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("Sin imagen de fondo", width / 2, height / 2);
      }

      const photoY = height * 0.24; 
      const photoH = height * 0.60; 
      const photoW = photoH; 
      const photoX = width * 0.07;  

      // --- 3. TÍTULO PRINCIPAL (IZQ) ---
      if (visibility.title) {
        const headerHeight = photoY; 
        const baseTitleCenterY = headerHeight / 2; 
        const baseTitleCenterX = photoX + (photoW / 2); 

        const titleTransform = transforms.title;
        const titleCenterX = baseTitleCenterX + (width * (titleTransform.x / 100));
        const titleCenterY = baseTitleCenterY + (height * (titleTransform.y / 100));

        ctx.save();
        let titleFontSize = (width * 0.065) * titleTransform.scale; 
        ctx.font = getFontString('title', titleFontSize);
        
        const tMetrics = ctx.measureText(texts.title);
        let textWidth = tMetrics.width;
        const maxTitleW = width * 0.60; 
        if (textWidth > maxTitleW) {
          titleFontSize = Math.floor(titleFontSize * (maxTitleW / textWidth));
          ctx.font = getFontString('title', titleFontSize);
          textWidth = ctx.measureText(texts.title).width;
        }

        const paddingX = width * 0.025;
        const badgeH = titleFontSize * 1.5; 
        const badgeW = textWidth + (paddingX * 2);
        const badgeX = titleCenterX - (badgeW / 2);
        const badgeY = titleCenterY - (badgeH / 2); 
        const borderRadius = width * 0.02; 

        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = width * 0.01;
        ctx.shadowOffsetX = width * 0.003;
        ctx.shadowOffsetY = width * 0.003;

        ctx.globalAlpha = 0.6; 
        ctx.fillStyle = colors.badge;
        roundRect(ctx, badgeX, badgeY, badgeW, badgeH, borderRadius);
        ctx.fill();
        
        ctx.globalAlpha = 1.0;
        ctx.shadowColor = "transparent";

        ctx.fillStyle = colors.badgeText;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle"; 
        
        ctx.fillText(texts.title, titleCenterX, titleCenterY + (titleFontSize * 0.05));
        ctx.restore();
      }

      // --- 4. IMAGEN USUARIO ---
      if (visibility.image) {
        const imgTransform = transforms.image;
        const basePhotoW = photoW; 
        const basePhotoH_img = photoH;
        const scaledPhotoW = basePhotoW * imgTransform.scale;
        const scaledPhotoH = basePhotoH_img * imgTransform.scale;
        const photoCenterX = photoX + (photoW / 2) + (width * (imgTransform.x / 100));
        const photoCenterY = photoY + (photoH / 2) + (height * (imgTransform.y / 100));
        const finalPhotoX = photoCenterX - (scaledPhotoW / 2);
        const finalPhotoY = photoCenterY - (scaledPhotoH / 2);

        if (userImage) {
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.3)";
          ctx.shadowBlur = width * 0.01;
          ctx.shadowOffsetX = width * 0.002;
          ctx.shadowOffsetY = width * 0.002;
          drawImageContain(ctx, userImage, finalPhotoX, finalPhotoY, scaledPhotoW, scaledPhotoH);
          ctx.restore();
        } else {
          ctx.save();
          ctx.strokeStyle = "rgba(255,255,255,0.5)";
          ctx.lineWidth = 4;
          ctx.setLineDash([10, 10]); 
          ctx.strokeRect(finalPhotoX, finalPhotoY, scaledPhotoW, scaledPhotoH);
          
          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.font = `bold ${width * 0.02}px sans-serif`;
          ctx.textAlign = "center";
          ctx.fillText("Tu PNG", photoCenterX, photoCenterY);
          ctx.restore();
        }
      }

      // --- 5. NÚMERO ---
      if (visibility.number && texts.number) {
          const numTransform = transforms.number;
          const badgeRadius = (width * 0.045) * numTransform.scale; 
          
          const refPhotoBottomY = photoY + photoH;
          const refPhotoCenterX = photoX + photoW / 2;

          const badgeX = refPhotoCenterX + (width * (numTransform.x / 100));
          const badgeY = (refPhotoBottomY + (width * 0.045) + (width * 0.02)) + (height * (numTransform.y / 100));
          
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.4)";
          ctx.shadowBlur = width * 0.01;
          ctx.shadowOffsetX = width * 0.003;
          ctx.shadowOffsetY = width * 0.003;

          ctx.beginPath();
          ctx.arc(badgeX, badgeY, badgeRadius, 0, Math.PI * 2);
          ctx.globalAlpha = 0.6; 
          ctx.fillStyle = colors.badge;
          ctx.fill();
          ctx.globalAlpha = 1.0;
          ctx.shadowColor = "transparent";
          ctx.fillStyle = colors.badgeText;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          
          const baseNumSize = texts.number.length > 2 ? width * 0.035 : width * 0.045;
          const numFontSize = baseNumSize * numTransform.scale;
          
          ctx.font = getFontString('number', numFontSize);
          ctx.fillText(texts.number, badgeX, badgeY + (width * 0.002));
          ctx.restore();
      }

      // --- TITULO 2 ---
      if (visibility.title2 && texts.title2) {
        const t2Transform = transforms.title2;
        const t2X = (width * 0.95) + (width * (t2Transform.x / 100)); 
        const t2Y = (height * 0.08) + (height * (t2Transform.y / 100));
        
        ctx.save();
        const t2FontSize = (width * 0.05) * t2Transform.scale;
        ctx.font = getFontString('title2', t2FontSize);
        ctx.fillStyle = colors.secondary;
        ctx.textAlign = "right";
        ctx.fillText(texts.title2, t2X, t2Y);
        ctx.restore();
      }

      // --- TITULO 3 ---
      if (visibility.title3 && texts.title3) {
        const t3Transform = transforms.title3;
        const t3X = (width * 0.95) + (width * (t3Transform.x / 100));
        const t3Y = (height * 0.13) + (height * (t3Transform.y / 100));
        
        ctx.save();
        const t3FontSize = (width * 0.03) * t3Transform.scale;
        ctx.font = getFontString('title3', t3FontSize);
        ctx.fillStyle = colors.secondary;
        ctx.textAlign = "right";
        ctx.fillText(texts.title3, t3X, t3Y);
        ctx.restore();
      }

      // --- LOGO 1 ---
      if (visibility.logo1 && logo1) {
        const l1Transform = transforms.logo1;
        const baseL1Size = width * 0.12; 
        const l1W = baseL1Size * l1Transform.scale;
        const l1H = l1W;
        
        const l1X = (width - l1W - (width * 0.02)) + (width * (l1Transform.x / 100));
        const l1Y = (height * 0.02) + (height * (l1Transform.y / 100));

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.2)";
        ctx.shadowBlur = width * 0.005;
        drawImageContain(ctx, logo1, l1X, l1Y, l1W, l1H);
        ctx.restore();
      }

      // --- LOGO 2 ---
      if (visibility.logo2 && logo2) {
        const l2Transform = transforms.logo2;
        const baseL2Size = width * 0.10; 
        const l2W = baseL2Size * l2Transform.scale;
        const l2H = l2W; 
        
        const l2X = (width * 0.02) + (width * (l2Transform.x / 100));
        const l2Y = (height - l2H - (height * 0.02)) + (height * (l2Transform.y / 100));

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.2)";
        ctx.shadowBlur = width * 0.005;
        drawImageContain(ctx, logo2, l2X, l2Y, l2W, l2H);
        ctx.restore();
      }

      // 6. MENSAJE
      if (visibility.message) {
        const msgTransform = transforms.message;
        const rightColStart = width * 0.52; 
        const rightColWidth = width * 0.45;
        
        const textX = rightColStart + (width * (msgTransform.x / 100));
        
        ctx.fillStyle = colors.message;
        const msgFontSize = (width * 0.035) * msgTransform.scale; 
        
        ctx.font = getFontString('message', msgFontSize);
        
        ctx.shadowBlur = 0; 
        const rgb = hexToRgb(colors.message);
        if (rgb && (rgb.r > 200 && rgb.g > 200 && rgb.b > 200)) {
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = width * 0.003;
        }
        
        const isTwoColumns = textStyles.message.columns === 2;
        const gutter = width * 0.02; 
        
        const maxMsgWidth = isTwoColumns 
          ? (rightColWidth * 0.95 - gutter) / 2 
          : rightColWidth * 0.95;
        
        const paragraphs = texts.message.split('\n');
        let lines = [];
        
        paragraphs.forEach(paragraph => {
            const words = paragraph.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
              const testLine = line + words[n] + ' ';
              const metrics = ctx.measureText(testLine);
              if (metrics.width > maxMsgWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
              } else {
                line = testLine;
              }
            }
            lines.push(line);
        });

        const lineHeight = msgFontSize * 1.5;
        
        let totalMsgHeight = 0;
        let col1Lines = [];
        let col2Lines = [];

        if (isTwoColumns) {
          const midPoint = Math.ceil(lines.length / 2);
          col1Lines = lines.slice(0, midPoint);
          col2Lines = lines.slice(midPoint);
          totalMsgHeight = Math.max(col1Lines.length, col2Lines.length) * lineHeight;
        } else {
          totalMsgHeight = lines.length * lineHeight;
        }
        
        const baseVerticalAnchor = height * 0.6;
        const startY = (baseVerticalAnchor - (totalMsgHeight / 2)) + (height * (msgTransform.y / 100));

        ctx.textAlign = "left"; 
        ctx.textBaseline = "alphabetic";

        if (isTwoColumns) {
          for (let i = 0; i < col1Lines.length; i++) {
              ctx.fillText(col1Lines[i], textX, startY + msgFontSize + (i * lineHeight));
          }
          const col2X = textX + maxMsgWidth + gutter;
          for (let i = 0; i < col2Lines.length; i++) {
              ctx.fillText(col2Lines[i], col2X, startY + msgFontSize + (i * lineHeight));
          }
        } else {
          for (let i = 0; i < lines.length; i++) {
              ctx.fillText(lines[i], textX, startY + msgFontSize + (i * lineHeight));
          }
        }
      }

      // 7. FOOTER
      if (visibility.footer) {
        const footTransform = transforms.footer;
        const footerFontSize = (width * 0.025) * footTransform.scale;
        
        const footerBaseX = width * 0.52;
        const footerBaseY = height * 0.92;

        const footerX = footerBaseX + (width * (footTransform.x / 100));
        const footerY = footerBaseY + (height * (footTransform.y / 100));

        ctx.font = getFontString('footer', footerFontSize);
        
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = colors.footer;
        ctx.shadowBlur = 0;
        const rgbF = hexToRgb(colors.footer);
        if (rgbF && (rgbF.r > 200 && rgbF.g > 200 && rgbF.b > 200)) {
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = width * 0.003;
        }

        ctx.fillText(texts.footer, footerX, footerY);
        ctx.globalAlpha = 1.0;
      }
    };

    useEffect(() => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const previewWidth = 800;
      const previewHeight = 800 / 1.414; 
      canvas.width = previewWidth;
      canvas.height = previewHeight;
      renderContent(ctx, previewWidth, previewHeight);
    }, [userImage, logo1, logo2, bgImageObject, texts, colors, transforms, textStyles, visibility]);

    const downloadImage = () => {
      const dimensions = paperSizes[selectedSize];
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = dimensions.width;
      tempCanvas.height = dimensions.height;
      const tempCtx = tempCanvas.getContext('2d');
      renderContent(tempCtx, dimensions.width, dimensions.height);
      const link = document.createElement('a');
      link.download = `tarjeta-${selectedSize}.png`;
      link.href = tempCanvas.toDataURL('image/png', 1.0);
      link.click();
    };

    return (
      <div className="min-h-screen bg-black text-gray-100 font-sans p-4 md:p-8">
        <div className="max-w-6xl mx-auto">
          <header className="mb-8 text-center">
            <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">
              Personalizador de Tarjetas
            </h1>
            <p className="text-gray-400">Diseña tarjetas apaisadas usando tus propias imágenes.</p>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-4">
              
              {/* NAVEGACIÓN DE PESTAÑAS */}
              <div className="flex bg-blue-800 rounded-t-xl overflow-hidden mb-0 border-b border-blue-700">
                  <button 
                      onClick={() => setActiveTab('photo')}
                      className={`flex-1 py-4 flex items-center justify-center gap-2 text-sm font-bold transition-colors ${activeTab === 'photo' ? 'bg-orange-600 text-white' : 'text-blue-200 hover:text-white hover:bg-blue-700'}`}
                  >
                      <i className="fa-regular fa-image text-lg"></i> Foto
                  </button>
                  <button 
                      onClick={() => setActiveTab('text')}
                      className={`flex-1 py-4 flex items-center justify-center gap-2 text-sm font-bold transition-colors ${activeTab === 'text' ? 'bg-orange-600 text-white' : 'text-blue-200 hover:text-white hover:bg-blue-700'}`}
                  >
                      <i className="fa-solid fa-font text-lg"></i> Contenido
                  </button>
                  <button 
                      onClick={() => setActiveTab('adjust')}
                      className={`flex-1 py-4 flex items-center justify-center gap-2 text-sm font-bold transition-colors ${activeTab === 'adjust' ? 'bg-orange-600 text-white' : 'text-blue-200 hover:text-white hover:bg-blue-700'}`}
                  >
                      <i className="fa-solid fa-gear text-lg"></i> Ajustes
                  </button>
              </div>

              <div className="bg-blue-50 p-6 rounded-b-xl rounded-tr-xl shadow-lg border border-blue-200 text-blue-900 min-h-[400px]">
                  
                  {/* 1. PESTAÑA: FOTO */}
                  {activeTab === 'photo' && (
                      <div className="space-y-6 animate-fadeIn">
                          
                          {/* FOTO PRINCIPAL */}
                          <div className="space-y-2">
                            <p className="text-sm font-bold text-blue-800 uppercase">1. Foto Principal</p>
                            <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-orange-300 border-dashed rounded-xl cursor-pointer bg-white hover:bg-orange-50 transition-colors group">
                                <div className="flex flex-col items-center pt-2 pb-3">
                                    <i className="fa-solid fa-camera text-2xl mb-2 text-orange-500 group-hover:scale-110 transition-transform"></i>
                                    <p className="text-xs text-blue-500">Subir Foto (PNG)</p>
                                </div>
                                <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setUserImage)} />
                            </label>
                            {userImage && <p className="text-xs text-green-600 text-center"><i className="fa-solid fa-check"></i> Foto cargada</p>}
                          </div>

                          {/* LOGOS ADICIONALES */}
                          <div className="grid grid-cols-2 gap-4">
                             <div className="space-y-2">
                                <p className="text-xs font-bold text-blue-800 uppercase text-center">Escudo (Sup. Dcha)</p>
                                <label className="flex flex-col items-center justify-center w-full h-24 border-2 border-blue-200 border-dashed rounded-lg cursor-pointer bg-white hover:bg-blue-50 transition-colors">
                                    <div className="flex flex-col items-center pt-2 pb-2">
                                        <i className="fa-solid fa-shield-halved text-xl mb-1 text-blue-400"></i>
                                        <p className="text-[10px] text-blue-400">Subir</p>
                                    </div>
                                    <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setLogo1)} />
                                </label>
                                {logo1 && <p className="text-[10px] text-green-600 text-center"><i className="fa-solid fa-check"></i> Listo</p>}
                             </div>

                             <div className="space-y-2">
                                <p className="text-xs font-bold text-blue-800 uppercase text-center">Bandera (Inf. Izq)</p>
                                <label className="flex flex-col items-center justify-center w-full h-24 border-2 border-blue-200 border-dashed rounded-lg cursor-pointer bg-white hover:bg-blue-50 transition-colors">
                                    <div className="flex flex-col items-center pt-2 pb-2">
                                        <i className="fa-solid fa-flag text-xl mb-1 text-blue-400"></i>
                                        <p className="text-[10px] text-blue-400">Subir</p>
                                    </div>
                                    <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setLogo2)} />
                                </label>
                                {logo2 && <p className="text-[10px] text-green-600 text-center"><i className="fa-solid fa-check"></i> Listo</p>}
                             </div>
                          </div>

                      </div>
                  )}

                  {/* 2. PESTAÑA: TEXTOS Y COLORES */}
                  {activeTab === 'text' && (
                      <div className="space-y-6 animate-fadeIn">
                          
                          {/* PANEL DE COLORES */}
                          <div className="p-4 bg-white rounded-xl border border-blue-100 shadow-sm space-y-3">
                              <p className="text-xs font-bold text-blue-400 uppercase tracking-wider mb-1">Colores Generales</p>
                              
                              {/* FILA 1: COLORES CIRCULARES */}
                              <div className="flex justify-around items-start">
                                  <ColorSwatch label="Fondos" value={colors.badge} onChange={(val) => setColors(prev => ({...prev, badge: val}))} />
                                  <ColorSwatch label="Texto 1" value={colors.badgeText} onChange={(val) => setColors(prev => ({...prev, badgeText: val}))} />
                                  <ColorSwatch label="Texto 2" value={colors.message} onChange={handleMainTextColorChange} />
                                  <ColorSwatch label="Texto 3" value={colors.secondary} onChange={(val) => setColors(prev => ({...prev, secondary: val}))} />
                              </div>
                          </div>

                          <div className="space-y-3">
                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Título 1 (Izq)</label>
                                    <input type="text" value={texts.title} onChange={(e) => handleTextChange('title', e.target.value)} className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none text-gray-800"/>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Número</label>
                                    <input type="text" value={texts.number} onChange={(e) => { const val = e.target.value.replace(/[^0-9]/g, '').slice(0, 3); handleTextChange('number', val); }} className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none text-center font-bold text-gray-800"/>
                                </div>
                              </div>

                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Título 2 (Sup Der)</label>
                                    <input type="text" value={texts.title2} onChange={(e) => handleTextChange('title2', e.target.value)} className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none text-gray-800"/>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Título 3 (Peq)</label>
                                    <input type="text" value={texts.title3} onChange={(e) => handleTextChange('title3', e.target.value)} className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none text-gray-800"/>
                                </div>
                              </div>
                              
                              <div>
                                  <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Mensaje Principal</label>
                                  <textarea 
                                  value={texts.message} 
                                  onChange={handleMessageChange}
                                  onKeyDown={handleMessageKeyDown} 
                                  className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none h-24 resize-none text-gray-800" 
                                  placeholder="Mensaje..."
                                  />
                              </div>
                              
                              <div>
                                  <label className="block text-[10px] font-bold text-blue-800 mb-1 uppercase">Pie de Página</label>
                                  <input type="text" value={texts.footer} onChange={(e) => handleTextChange('footer', e.target.value)} className="w-full px-3 py-2 border border-blue-200 rounded text-sm focus:ring-1 focus:ring-orange-500 outline-none text-gray-800"/>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 3. PESTAÑA: AJUSTES */}
                  {activeTab === 'adjust' && (
                      <div className="space-y-6 animate-fadeIn">
                          
                          <div className="flex overflow-x-auto pb-2 gap-2 mb-4 scrollbar-hide">
                              {Object.keys(elementLabels).map(key => (
                              <button
                                  key={key}
                                  onClick={() => setActiveElement(key)}
                                  className={`px-3 py-2 text-[10px] font-bold rounded-lg transition-all border shadow-sm flex-shrink-0 uppercase ${
                                  activeElement === key 
                                  ? 'bg-orange-600 text-white border-orange-600' 
                                  : 'bg-white border-blue-200 text-blue-900 hover:bg-blue-50'
                                  }`}
                              >
                                  {elementLabels[key]}
                              </button>
                              ))}
                          </div>

                          <div className="bg-white p-5 rounded-xl border border-blue-200 shadow-sm space-y-5">
                              
                              {/* TOGGLE VISIBILIDAD */}
                              <div className="flex items-center justify-between p-3 bg-blue-50 rounded-lg border border-blue-100">
                                  <span className="text-sm font-bold text-blue-900 flex items-center gap-2">
                                      <i className="fa-solid fa-eye"></i> Ver {elementLabels[activeElement]}
                                  </span>
                                  <button 
                                      onClick={() => toggleVisibility(activeElement)}
                                      className={`w-12 h-6 rounded-full p-1 transition-colors duration-200 ease-in-out focus:outline-none ${visibility[activeElement] ? 'bg-green-500' : 'bg-gray-300'}`}
                                  >
                                      <div className={`w-4 h-4 rounded-full bg-white shadow-sm transform transition-transform duration-200 ease-in-out ${visibility[activeElement] ? 'translate-x-6' : 'translate-x-0'}`} />
                                  </button>
                              </div>

                              {/* ESTILOS DE TEXTO (Solo si no es imagen/logo) */}
                              {['title', 'title2', 'title3', 'message', 'footer', 'number'].includes(activeElement) && (
                              <div className="border-b border-blue-100 pb-4">
                                  <p className="text-xs font-bold text-blue-400 mb-3 uppercase tracking-wider">Estilo</p>
                                  <div className="flex flex-wrap items-center gap-2">
                                      <select 
                                          value={textStyles[activeElement]?.font || 'sans-serif'}
                                          onChange={(e) => updateTextStyle('font', e.target.value)}
                                          className="text-xs border border-blue-200 rounded-md px-3 py-2 bg-blue-50 text-blue-900 focus:outline-none focus:ring-1 focus:ring-orange-500 flex-grow"
                                      >
                                          {fontOptions.map(opt => (
                                              <option key={opt.value} value={opt.value}>{opt.label}</option>
                                          ))}
                                      </select>

                                      <button 
                                          onClick={() => updateTextStyle('bold', !textStyles[activeElement].bold)}
                                          className={`p-2 rounded-md border transition-colors ${textStyles[activeElement].bold ? 'bg-orange-100 border-orange-300 text-orange-700' : 'bg-white border-blue-200 text-blue-600 hover:bg-blue-50'}`}
                                          title="Negrita"
                                      >
                                          <i className="fa-solid fa-bold"></i>
                                      </button>

                                      <button 
                                          onClick={() => updateTextStyle('italic', !textStyles[activeElement].italic)}
                                          className={`p-2 rounded-md border transition-colors ${textStyles[activeElement].italic ? 'bg-orange-100 border-orange-300 text-orange-700' : 'bg-white border-blue-200 text-blue-600 hover:bg-blue-50'}`}
                                          title="Cursiva"
                                      >
                                          <i className="fa-solid fa-italic"></i>
                                      </button>

                                      {activeElement === 'message' && (
                                          <>
                                            <button 
                                                onClick={() => updateTextStyle('bullets', !textStyles[activeElement].bullets)}
                                                className={`p-2 rounded-md border transition-colors ${textStyles[activeElement].bullets ? 'bg-orange-100 border-orange-300 text-orange-700' : 'bg-white border-blue-200 text-blue-600 hover:bg-blue-50'}`}
                                                title="Lista con puntos"
                                            >
                                                <i className="fa-solid fa-list-ul"></i>
                                            </button>
                                            
                                            <button 
                                                onClick={() => updateTextStyle('columns', textStyles[activeElement].columns === 1 ? 2 : 1)}
                                                className={`p-2 rounded-md border transition-colors ${textStyles[activeElement].columns === 2 ? 'bg-orange-100 border-orange-300 text-orange-700' : 'bg-white border-blue-200 text-blue-600 hover:bg-blue-50'}`}
                                                title="2 Columnas"
                                            >
                                                <i className="fa-solid fa-columns"></i>
                                            </button>
                                          </>
                                      )}
                                  </div>
                              </div>
                              )}

                              {/* TRANSFORMACIÓN */}
                              <div>
                                  <p className="text-xs font-bold text-blue-400 mb-3 uppercase tracking-wider">Posición y Tamaño</p>
                                  <div className="space-y-4">
                                      <div>
                                          <div className="flex justify-between mb-1">
                                              <span className="text-xs font-medium text-blue-800 flex items-center gap-1"><i className="fa-solid fa-arrows-left-right text-xs"></i> Horizontal (X)</span>
                                              <span className="text-xs text-orange-600 font-mono">{transforms[activeElement].x}%</span>
                                          </div>
                                          <input type="range" min="-50" max="50" step="1" value={transforms[activeElement].x} onChange={(e) => updateTransform('x', e.target.value)} className="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-orange-600" />
                                      </div>
                                      <div>
                                          <div className="flex justify-between mb-1">
                                              <span className="text-xs font-medium text-blue-800 flex items-center gap-1"><i className="fa-solid fa-arrows-up-down text-xs"></i> Vertical (Y)</span>
                                              <span className="text-xs text-orange-600 font-mono">{transforms[activeElement].y}%</span>
                                          </div>
                                          <input type="range" min="-50" max="50" step="1" value={transforms[activeElement].y} onChange={(e) => updateTransform('y', e.target.value)} className="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-orange-600" />
                                      </div>
                                      <div>
                                          <div className="flex justify-between mb-1">
                                              <span className="text-xs font-medium text-blue-800 flex items-center gap-1"><i className="fa-solid fa-expand text-xs"></i> Tamaño</span>
                                              <span className="text-xs text-orange-600 font-mono">{transforms[activeElement].scale}x</span>
                                          </div>
                                          <input type="range" min="0.5" max="3" step="0.1" value={transforms[activeElement].scale} onChange={(e) => updateTransform('scale', e.target.value)} className="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-orange-600" />
                                      </div>
                                  </div>
                              </div>
                              
                              <div className="text-center border-t border-blue-100 pt-4">
                                  <button onClick={() => updateTransform('scale', 1) || updateTransform('x', 0) || updateTransform('y', 0)} className="text-xs text-red-500 hover:text-red-700 hover:underline transition-colors">
                                      Restablecer valores por defecto
                                  </button>
                              </div>
                          </div>
                      </div>
                  )}

              </div>
            </div>

            {/* COLUMNA DERECHA: VISTA PREVIA Y DESCARGA */}
            <div className="lg:col-span-8 flex flex-col items-center">
              <div className="sticky top-8 w-full flex flex-col items-center max-w-2xl">
                <div className="bg-blue-50 p-2 rounded shadow-lg border border-blue-200 mb-6 w-full relative">
                  <canvas ref={canvasRef} className="w-full h-auto bg-white rounded-sm" style={{ aspectRatio: '1.414 / 1' }} />
                </div>
                <div className="flex flex-col sm:flex-row gap-4 w-full bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-200 text-blue-900">
                  <div className="flex-1">
                    <label className="block text-xs font-bold text-blue-500 mb-1 uppercase tracking-wide">
                      <i className="fa-solid fa-expand"></i> Formato de Salida
                    </label>
                    <div className="flex gap-2">
                      {Object.keys(paperSizes).map((size) => (
                        <button key={size} onClick={() => setSelectedSize(size)} className={`flex-1 py-2 px-3 rounded text-sm font-medium transition-colors ${selectedSize === size ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-blue-700 border border-blue-200 hover:bg-orange-50'}`}>
                          {size}
                        </button>
                      ))}
                    </div>
                  </div>
                  <button onClick={downloadImage} className="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-orange-600 text-white rounded-lg font-bold hover:bg-orange-700 transition-all shadow-md mt-4 sm:mt-0 shadow-orange-900/20">
                    <i className="fa-solid fa-download"></i> Descargar {selectedSize}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('card-generator-root'));
  root.render(<App />);
</script></body></html>
